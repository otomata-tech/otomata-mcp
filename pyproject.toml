[project]
name = "otomata-mcp"
version = "0.6.0"
description = "Socle commun des serveurs MCP Otomata : doctrines en base servies en tools, mémoire partagée versionnée, RBAC + ACL (grants par utilisateur), runs start/stop, capitalisation (feedback), logging, adaptateurs Postgres (asyncpg) et PostgREST/Supabase prêts à l'emploi. Tout-en-tools, scope injecté (intra-entreprise ; le × Z reste à l'orchestrateur)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Otomata", email = "alexis@otomata.tech" }]
keywords = ["mcp", "fastmcp", "doctrine", "rbac", "multi-tenant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]
# ⚠️ La fenêtre où le socle FONCTIONNE, mesurée le 2026-09-03 sur `main` :
#   fastmcp 2.14.7 → collecte des tests cassée (pydantic : NameError 'Optional')
#   fastmcp 3.4.7  → vert
#   fastmcp 4.0.2  → test_socle ROUGE — le `run_id` n'est plus corrélé : le
#                    contexte de run ne traverse plus l'appel d'outil
#
# `>=2.0` mentait AUX DEUX BOUTS. La borne basse autorisait une installation qui
# ne collecte pas ; la borne haute manquait, et c'est la plus coûteuse — sur 4.x
# les appels d'outil ABOUTISSENT, seule la corrélation de run disparaît. Un défaut
# qui ne se signale pas : le service répond, et l'observabilité s'en va.
#
# ⚠️ Avant de relever la borne haute un jour, vérifier que la corrélation est
# rétablie PAR UNE MESURE, jamais par la lecture d'un journal des changements —
# un appel qui réussit sans son `run_id` ressemble exactement à un appel sain.
dependencies = ["fastmcp>=3,<4"]

[project.optional-dependencies]
pg = ["asyncpg>=0.29"]
postgrest = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "asyncpg>=0.29", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/otomata-tech/otomata-mcp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["otomata_mcp*"]
